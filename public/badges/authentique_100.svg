  </defs>
  
  <rect x="4" y="4" width="312" height="72" rx="36" fill="url(#shieldBg)" filter="url(#badgeShadow)"/>
  <rect x="6" y="6" width="308" height="68" rx="34" fill="none" stroke="url(#goldBorder)" stroke-width="2"/>

