<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="truckBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <rect x="4" y="4" width="312" height="72" rx="36" fill="url(#truckBg)" filter="url(#badgeShadow)"/>
  <rect x="6" y="6" width="308" height="68" rx="34" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Icon Circle -->
  <circle cx="42" cy="40" r="24" fill="#FFFFFF"/>
  <!-- Truck Icon -->
  <g transform="translate(28, 26) scale(1.2)" stroke="#E11D48" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1" y="3" width="15" height="13"/>
    <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/>
    <circle cx="5.5" cy="18.5" r="2.5"/>
    <circle cx="18.5" cy="18.5" r="2.5"/>
  </g>

  <!-- Text -->
  <text x="78" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">LIVRAISON 24 GOUV</text>
  <text x="78" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#FFE4E6" letter-spacing="0.2">Toute la Tunisie en 24/48h</text>
</svg>
